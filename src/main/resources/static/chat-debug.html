<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能体编排调试界面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .message.user {
            align-items: flex-end;
        }

        .message.assistant {
            align-items: flex-start;
        }

        .message-header {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
            padding: 0 10px;
        }

        .message-content {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 18px;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .debug-info {
            font-size: 11px;
            color: #999;
            margin-top: 5px;
            padding: 5px 10px;
            background: #f9f9f9;
            border-radius: 8px;
            border-left: 3px solid #667eea;
        }

        .chat-input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .chat-input:focus {
            border-color: #667eea;
        }

        .send-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .send-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .settings {
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 13px;
            color: #666;
        }

        .settings label {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .settings input[type="number"] {
            width: 80px;
            padding: 5px 10px;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            font-size: 13px;
        }

        .typing-indicator {
            display: none;
            padding: 12px 18px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            max-width: 80%;
        }

        .typing-indicator.show {
            display: inline-block;
        }

        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            margin: 0 2px;
            background: #667eea;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }

        .clear-btn {
            padding: 5px 15px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .clear-btn:hover {
            background: #ee5a5a;
        }

        .delete-memory-btn {
            padding: 5px 15px;
            background: #ffa502;
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .delete-memory-btn:hover {
            background: #ff9500;
        }

        .view-history-btn {
            padding: 5px 15px;
            background: #4ecdc4;
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .view-history-btn:hover {
            background: #3dbdb5;
        }

        /* 历史记录弹窗样式 */
        .history-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .history-modal.show {
            display: flex;
        }

        .history-content {
            background: white;
            border-radius: 15px;
            max-width: 800px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .history-header h2 {
            margin: 0;
            color: #333;
            font-size: 20px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
            padding: 0;
            width: 30px;
            height: 30px;
            line-height: 30px;
            text-align: center;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: #f0f0f0;
            color: #333;
        }

        .history-item {
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            background: #f9f9f9;
        }

        .history-item.user {
            background: #e8f0fe;
            border-left: 4px solid #667eea;
        }

        .history-item.assistant {
            background: #f0f0f0;
            border-left: 4px solid #764ba2;
        }

        .history-item-role {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #666;
        }

        .history-item-content {
            font-size: 14px;
            line-height: 1.6;
            color: #333;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .no-history {
            text-align: center;
            color: #999;
            padding: 40px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🤖 智能体编排调试界面</h1>
            <p>用户可自定义选择策略：快速响应 or 高质量回复</p>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message assistant">
                <div class="message-header">系统</div>
                <div class="message-content">
                    欢迎使用智能体编排调试界面！

🎯 策略选择说明：
 快速模式 - 路由策略（响应快，成本低）
   适合：简单查询、天气、路线、数据库查询

✨ 高质量模式 - 编排策略（质量高，支持复杂任务）
   适合：小说创作、旅行规划、多步骤推理

🤖 自动选择 - 根据意图自动判断（可能不准确）

💡 建议：
- 简单问题选"快速模式"
- 复杂任务选"高质量模式"
                </div>
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">
            <span></span><span></span><span></span>
        </div>

        <div class="chat-input-container">
            <div class="input-group">
                <input type="text" class="chat-input" id="messageInput" 
                       placeholder="输入消息...（按 Enter 发送）" 
                       autocomplete="off">
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
            </div>
            <div class="settings">
                <label>
                    会话ID:
                    <input type="number" id="memoryId" value="1" min="0">
                </label>
                <label>
                    <input type="radio" name="strategy" value="routing" id="strategyRouting" checked>
                    <span style="cursor: pointer;">🚀 快速模式</span>
                </label>
                <label>
                    <input type="radio" name="strategy" value="orchestrator" id="strategyOrchestrator">
                    <span style="cursor: pointer;">✨ 高质量模式</span>
                </label>
                <label>
                    后端地址:
                    <input type="text" id="backendUrl" value="http://localhost:8081" style="width: 180px; padding: 5px 10px; border: 1px solid #e0e0e0; border-radius: 5px; font-size: 13px;">
                </label>
                <button class="clear-btn" onclick="clearMessages()">清空消息</button>
                <button class="view-history-btn" onclick="viewHistory()">📜 查看历史</button>
                <button class="delete-memory-btn" onclick="deleteMemory()">🗑️ 删除记忆</button>
            </div>
        </div>
    </div>

    <!-- 历史记录弹窗 -->
    <div class="history-modal" id="historyModal">
        <div class="history-content">
            <div class="history-header">
                <h2>📜 历史消息记录</h2>
                <button class="close-btn" onclick="closeHistory()">&times;</button>
            </div>
            <div id="historyList"></div>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');
        const memoryIdInput = document.getElementById('memoryId');
        const backendUrlInput = document.getElementById('backendUrl');
        const strategyInputs = document.querySelectorAll('input[name="strategy"]');

        // 回车发送
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            const memoryId = memoryIdInput.value;
            const backendUrl = normalizeBackendUrl();
            
            // 获取用户选择的策略
            let selectedStrategy = 'routing'; // 默认快速模式
            strategyInputs.forEach(radio => {
                if (radio.checked) {
                    selectedStrategy = radio.value;
                }
            });
            
            // 根据策略选择 API 路径
            let apiPath = '/api/ai/chat/routing'; // 默认路由策略
            if (selectedStrategy === 'orchestrator') {
                apiPath = '/api/ai/chat/orchestrator';
            }

            // 添加用户消息
            addMessage('user', message);
            messageInput.value = '';
            messageInput.disabled = true;
            sendBtn.disabled = true;
            typingIndicator.classList.add('show');

            try {
                // 构建完整的 SSE URL
                const fullUrl = `${backendUrl}${apiPath}?memoryId=${memoryId}&message=${encodeURIComponent(message)}`;
                
                console.log('请求 URL:', fullUrl);
                console.log('选择策略:', selectedStrategy);
                
                // 【修复】先创建一个空的 AI 消息容器，用于接收流式输出
                const assistantMessageDiv = createEmptyAssistantMessage();
                const contentDiv = assistantMessageDiv.querySelector('.message-content');
                
                // 创建 SSE 连接
                const eventSource = new EventSource(fullUrl);
                
                let assistantMessage = '';

                eventSource.onmessage = (event) => {
                    const data = event.data;
                    
                    if (data) {
                        assistantMessage += data;
                        // 【修复】直接更新内容，不要调用 updateAssistantMessage
                        contentDiv.textContent = assistantMessage;
                        scrollToBottom();
                    }
                };

                eventSource.onerror = (error) => {
                    console.error('SSE 错误:', error);
                    eventSource.close();
                    
                    if (assistantMessage) {
                        // 如果有部分内容，更新头部
                        const header = assistantMessageDiv.querySelector('.message-header');
                        if (header) {
                            header.textContent = 'AI 助手（连接中断）';
                        }
                    } else {
                        // 完全失败，移除空消息并显示错误
                        assistantMessageDiv.remove();
                        addMessage('assistant', `❌ 请求失败\n\n可能原因：\n1. 后端服务未启动\n2. 接口路径错误\n3. 参数格式问题\n\n当前请求地址：${fullUrl}\n\n请检查：\n- 后端是否在 ${backendUrl} 运行\n- 接口路径是否正确\n- 查看浏览器控制台（F12）获取详细错误`);
                    }
                    
                    resetInput();
                };

                eventSource.addEventListener('complete', () => {
                    eventSource.close();
                    // 更新头部为完成状态
                    const header = assistantMessageDiv.querySelector('.message-header');
                    if (header) {
                        header.textContent = 'AI 助手';
                    }
                    resetInput();
                });

            } catch (error) {
                console.error('发送消息失败:', error);
                addMessage('assistant', '❌ 发送失败: ' + error.message);
                resetInput();
            }
        }

        function addMessage(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const header = document.createElement('div');
            header.className = 'message-header';
            header.textContent = role === 'user' ? '用户' : 'AI 助手';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;
            
            messageDiv.appendChild(header);
            messageDiv.appendChild(contentDiv);
            chatMessages.appendChild(messageDiv);
            
            scrollToBottom();
        }

        // 【新增】创建空的 AI 消息容器
        function createEmptyAssistantMessage() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            
            const header = document.createElement('div');
            header.className = 'message-header';
            header.textContent = 'AI 助手（流式输出中...）';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = '';
            
            messageDiv.appendChild(header);
            messageDiv.appendChild(contentDiv);
            chatMessages.appendChild(messageDiv);
            
            scrollToBottom();
            return messageDiv;
        }

        // 【废弃】updateAssistantMessage 不再使用，保留以防万一
        function updateAssistantMessage(content) {
            // 查找最后一条 AI 消息
            const messages = chatMessages.querySelectorAll('.message.assistant');
            let lastMessage = messages[messages.length - 1];
            
            // 如果没有或者最后一条不是 AI 消息，创建新的
            if (!lastMessage || lastMessage.querySelector('.message-header').textContent === '系统') {
                lastMessage = document.createElement('div');
                lastMessage.className = 'message assistant';
                
                const header = document.createElement('div');
                header.className = 'message-header';
                header.textContent = 'AI 助手（流式输出中...）';
                
                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';
                
                lastMessage.appendChild(header);
                lastMessage.appendChild(contentDiv);
                chatMessages.appendChild(lastMessage);
            }
            
            // 更新内容
            const contentDiv = lastMessage.querySelector('.message-content');
            contentDiv.textContent = content;
            
            // 更新头部
            const header = lastMessage.querySelector('.message-header');
            header.textContent = 'AI 助手（流式输出中...）';
            
            scrollToBottom();
        }

        function resetInput() {
            messageInput.disabled = false;
            sendBtn.disabled = false;
            messageInput.focus();
            typingIndicator.classList.remove('show');
            
            // 更新最后一条消息的头部
            const messages = chatMessages.querySelectorAll('.message.assistant');
            if (messages.length > 0) {
                const lastMessage = messages[messages.length - 1];
                const header = lastMessage.querySelector('.message-header');
                if (header) {
                    header.textContent = 'AI 助手';
                }
            }
        }

        function clearMessages() {
            chatMessages.innerHTML = `
                <div class="message assistant">
                    <div class="message-header">系统</div>
                    <div class="message-content">
                        消息已清空。输入新消息开始对话！
                    </div>
                </div>
            `;
        }

        // 【新增】删除记忆功能
        async function deleteMemory() {
            const memoryId = memoryIdInput.value;
            const backendUrl = normalizeBackendUrl();
            
            if (!confirm(`确定要删除会话 ${memoryId} 的所有记忆吗？\n此操作不可恢复！`)) {
                return;
            }
            
            try {
                const url = `${backendUrl}/api/memory/clear/${memoryId}`;
                console.log('删除记忆请求 URL:', url);
                
                const response = await fetch(url, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                console.log('响应状态:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP 错误! 状态码: ${response.status}`);
                }
                
                const result = await response.json();
                console.log('删除结果:', result);
                
                if (result.success) {
                    addMessage('assistant', `✅ 记忆删除成功\n\n会话ID: ${memoryId}\n${result.message}`);
                    // 同时清空前端消息
                    clearMessages();
                } else {
                    addMessage('assistant', `❌ 删除失败: ${result.message || '未知错误'}`);
                }
            } catch (error) {
                console.error('删除记忆失败:', error);
                addMessage('assistant', `❌ 删除失败\n\n错误信息: ${error.message}\n\n请检查：\n1. 后端服务是否在 ${backendUrl} 运行\n2. 接口路径是否正确\n3. 查看浏览器控制台（F12）获取详细错误\n4. 确认 sessionId=${memoryId} 是否存在`);
            }
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // 【新增】查看历史消息功能
        async function viewHistory() {
            const memoryId = memoryIdInput.value;
            const backendUrl = normalizeBackendUrl();
            
            try {
                const url = `${backendUrl}/api/memory/history/${memoryId}`;
                console.log('查看历史请求 URL:', url);
                
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                console.log('响应状态:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP 错误! 状态码: ${response.status}`);
                }
                
                const result = await response.json();
                console.log('历史消息:', result);
                
                // 显示弹窗
                const modal = document.getElementById('historyModal');
                const historyList = document.getElementById('historyList');
                
                if (result.success && result.messages && result.messages.length > 0) {
                    let html = '';
                    result.messages.forEach(msg => {
                        const roleClass = msg.role === 'user' ? 'user' : 'assistant';
                        const roleName = msg.role === 'user' ? '用户' : 'AI助手';
                        html += `
                            <div class="history-item ${roleClass}">
                                <div class="history-item-role">${roleName}</div>
                                <div class="history-item-content">${escapeHtml(msg.content)}</div>
                            </div>
                        `;
                    });
                    historyList.innerHTML = html;
                } else {
                    historyList.innerHTML = '<div class="no-history">暂无历史消息</div>';
                }
                
                modal.classList.add('show');
                
            } catch (error) {
                console.error('查看历史失败:', error);
                alert(`❌ 查看历史失败\n\n错误信息: ${error.message}\n\n请检查：\n1. 后端服务是否在 ${backendUrl} 运行\n2. 接口路径是否正确`);
            }
        }

        // 【新增】关闭历史弹窗
        function closeHistory() {
            const modal = document.getElementById('historyModal');
            modal.classList.remove('show');
        }

        // 【新增】HTML转义函数，防止XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function normalizeBackendUrl() {
            const raw = backendUrlInput.value.trim().replace(/\/$/, '');
            if (!raw) return raw;
            // 输入中若已包含 /api，避免拼接后出现 /api/api
            return raw.endsWith('/api') ? raw.slice(0, -4) : raw;
        }

        // 点击弹窗外部关闭
        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.getElementById('historyModal');
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    closeHistory();
                }
            });
        });

        // 页面加载完成后聚焦输入框
        window.onload = () => {
            messageInput.focus();
        };
    </script>
</body>
</html>
